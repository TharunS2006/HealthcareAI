# Every push and pull request: lint, type-check, every verify suite, and the
# production build. A red check here means something a health worker relies on
# broke — the suites cover triage, referrals, sign-in, the relay, the outbox,
# device-database upgrades and the district service.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type-check (app, server and verify scripts)
        run: npm run typecheck

      - name: Verify suites
        run: npm run verify

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
