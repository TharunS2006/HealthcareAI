# Every push and pull request: lint, type-check, every verify suite, and the
# production build. A red check here means something a health worker relies on
# broke — the suites cover triage, referrals, sign-in, the relay, the outbox,
# device-database upgrades and the district service.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Production runs the district service on PostgreSQL; verify:postgres
    # drives it against this one (every other suite uses SQLite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nalammesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r backend/requirements-postgres.txt

      - name: Lint
        run: npm run lint

      - name: Type-check (app, server and verify scripts)
        run: npm run typecheck

      - name: Verify suites
        run: npm run verify
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nalammesh_test

      - name: Production build
        run: npm run build

      # GIGW 3.0 asks for WCAG 2.1 AA. axe-core's automated rules on every page
      # of the build, signed in per role — a floor, not a manual audit.
      - name: Accessibility (axe-core, WCAG 2.1 A/AA)
        run: |
          npx playwright install --with-deps chromium
          npm run check:a11y

      # The first promise: a sub-centre with no signal keeps working. Install the
      # service worker, stop the server, and open the ANM's screens from cache.
      - name: Offline (service worker, server stopped)
        run: npm run check:offline

      # The whole system in production mode, as a district starts it: a
      # production build, the relay on its store file, the district service,
      # and the first day's flow in a browser — accounts, a RED referral, the
      # pre-arrival board, the access log, revocation, a relay restart.
      # Rebuilds out/ in production mode, so it runs after the checks above.
      - name: Production flow (relay, district service, browser)
        run: npm run check:production

      # express and socket.io are runtime dependencies (the relay runs on them),
      # so this audit covers the relay as well as the app.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # requirements.txt sets minimum versions, so every install resolves afresh;
      # audit what that resolves to today, under the same Python as the deploys.
      # requirements-postgres.txt is requirements.txt plus the PostgreSQL driver.
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-postgres.txt --progress-spinner off
